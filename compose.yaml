# iAnalytics · despliegue con Docker
#   cp .env.example .env        # completar claves
#   docker compose up -d --build
# Sitio:   http://localhost:4321/
# Backend: http://localhost:8000/admin/  ·  API: http://localhost:8000/api/v1/docs/
name: ianalytics

services:
  database:
    build:
      context: ./database
      dockerfile: dockerfile
    image: ${IMAGE_PREFIX:-}ianalytics_database:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ianalytics}
      MYSQL_USER: ${MYSQL_USER:-ianalytics}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    # Solo accesible desde este equipo (para herramientas como DBeaver o MySQL Workbench)
    ports:
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3307}:3306"

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    image: ${IMAGE_PREFIX:-}ianalytics_backend:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ianalytics}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE:-ianalytics}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Definir DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Nombre con que el frontend llama al backend dentro de la red de Docker
      DJANGO_INTERNAL_HOSTS: backend
      FRONTEND_PUBLIC_URL: ${PUBLIC_SITE_URL:-https://ianalytics.cl}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-12}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-False}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      LOAD_INITIAL_CONTENT: ${LOAD_INITIAL_CONTENT:-True}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-none}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEEPL_API_URL: ${DEEPL_API_URL:-https://api-free.deepl.com/v2/translate}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-}
      LIBRETRANSLATE_API_KEY: ${LIBRETRANSLATE_API_KEY:-}
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@ianalytics.cl}
      CONTACT_NOTIFICATION_EMAILS: ${CONTACT_NOTIFICATION_EMAILS:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - media_data:/app/media
    ports:
      - "${BACKEND_PUBLISHED_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend/web
      dockerfile: dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ianalytics.cl}
    image: ${IMAGE_PREFIX:-}ianalytics_frontend:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      CONTENT_CACHE_SECONDS: ${CONTENT_CACHE_SECONDS:-30}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-3000}
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-false}
      # Panel de administración (/panel/)
      DJANGO_ADMIN_PUBLIC_URL: ${DJANGO_ADMIN_PUBLIC_URL:-http://localhost:8000/admin/}
      PANEL_SESSION_HOURS: ${TOKEN_TTL_HOURS:-12}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://ianalytics.cl}
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-4321}:4321"

volumes:
  mysql_data:
  media_data:
